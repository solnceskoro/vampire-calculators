<style>
:root{--bg:#16111a;--surface:#1f1824;--surface2:#271e2d;--line:#352a3a;--ink:#efe6ec;--muted:#a998a4;--accent:#e0607e;
--d4:#e0607e;--d3:#e39a5a;--d2:#d6c46a;--d1:#7fb48f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Golos Text",system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:32px 16px 64px}
a{color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top a.back{color:var(--muted);text-decoration:none;font-size:.92rem}

.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);font:600 .85rem "Golos Text",sans-serif;padding:6px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:#1a0f14}
h1{font:400 2rem/1.2 "Prata",Georgia,serif;margin:0 0 8px}

h2{font:400 1.45rem/1.25 "Prata",Georgia,serif;margin:44px 0 14px}
h3{font:600 1rem "Golos Text",sans-serif;margin:0 0 6px}
p{margin:0 0 14px}
.lead{color:var(--muted);max-width:760px}
.muted{color:var(--muted)}
ul,ol{margin:0 0 14px;padding-left:22px}
li{margin-bottom:8px}

.tag{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.02em;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:1px;white-space:nowrap}
.tag.off{border-color:#4d6b58;color:#9fd0ad}
.tag.pl{border-color:#6b5a3d;color:#e4c48a}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:0}
.terms div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.terms dt{font-weight:600}
.terms dd{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.thr{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0 6px;max-width:760px}
.tag.data{border-color:#4a5a7a;color:#a9bde4}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl{border-collapse:collapse;width:100%;min-width:560px;font-size:.9rem}
.tbl th,.tbl td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th{background:var(--surface2);font-weight:600;color:var(--muted);font-size:.8rem}
.tbl td{background:var(--surface)}
.tbl td.n{font:400 1.1rem "Prata",serif;white-space:nowrap}
.tbl td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.thr div{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.thr b{display:block;font:400 1.35rem "Prata",serif}
.thr small{color:var(--muted);font-size:.78rem}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.filters button{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 12px;font:600 .82rem "Golos Text",sans-serif;cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--accent);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.trait{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.trait .shot{display:block;background:#120d15;border:0;border-bottom:1px solid var(--line);cursor:zoom-in;padding:0;width:100%}
.trait .shot img{display:block;width:100%;height:220px;object-fit:cover;object-position:top}
.trait .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.trait .name b{font:400 1.2rem "Prata",serif}
.attrs{display:flex;gap:6px;flex-wrap:wrap}
.attrs span{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:.82rem}
.eff{font-size:.9rem}
.dom{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.dots{display:inline-flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.note{font-size:.88rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}
.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:10px}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 14px 58px;position:relative;margin:0}
.steps li::before{content:counter(s);position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#1a0f14;font:600 .9rem/28px "Golos Text";text-align:center}
.tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tips .box p{color:var(--muted);font-size:.92rem;margin:0}
.tips .warn{border-color:#6b3040}
.tips .warn h3{color:var(--accent)}
footer{margin-top:48px;color:var(--muted);font-size:.85rem}
dialog{border:0;padding:0;background:transparent;max-width:min(92vw,520px)}
dialog::backdrop{background:rgba(8,5,10,.85)}
dialog img{display:block;width:100%;border-radius:10px}
dialog button{position:absolute;top:8px;right:8px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;width:34px;height:34px;font-size:1.1rem;cursor:pointer}
[hidden]{display:none!important}
@media (max-width:520px){h1{font-size:1.6rem}.thr{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>

 th_lv:'Уровень', th_need:'Нужно', th_who:'Кто дотягивает', th_when:'Когда примерно',

 steps_lead:`За одно скрещивание атрибут вырастает максимум на <b>30</b> ${PL.ru}. Значит, чтобы дойти с ур. 2 (60) до ур. 4 (120), нужно несколько поколений: вывели потомка — вырастили — скрестили снова.`,
 footer:'Источники: справка игры (раздел о питомцах) и заметки игрока из чата «Питомцы — свойства».'
},
en:{
 title:'Pet Breeding Guide', back:'← All calculators',

 levels_note:'Exception: Alchemy I and II need 10 less — 50 / 80 / 110 / 140 / 170.',

 reach_how:'How we estimated: the class\'s base attributes are split across 5 attributes (main ones usually get more), each pet level gives +1 to 2 random attributes, and a mutation adds more points spread across all five at random. Evolution and group effects add on top and are not included.',

 ['Общие атрибуты','Базовые плюс бонусы от мутации, уровней и групп. Именно по ним считается уровень свойства, но потомку они не передаются.'],

en:[

 ['Main attributes','Two of the pet\'s five attributes that decide its trait level.'],

 {id:'wells',a:['st','in'],d:3,g:'hi',ru:{n:'Колодцы',e:'Больше авторитета с Колодцев слёз в Нижнем мире',v:'+10 / 20 / 30 / 40 / 50%',dl:'легко',r:'Полезное и важное.'},en:{n:'Wells',e:'More prestige from the Wells of Tears in the Underworld',v:'+10 / 20 / 30 / 40 / 50%',dl:'easily',r:'Useful and important.'}},
 {id:'crystals',a:['ch','st'],d:2,g:'mid',ru:{n:'Кристаллы',e:'Больше капитала и вклада гильдии с Кристаллитов',v:'+10 / 20 / 30 / 40 / 50%',dl:'средне',r:'Важное: капитал гильдии нужен для приливов и снабжения в войне.'},en:{n:'Crystals',e:'More guild capital and contribution from Crystallites',v:'+10 / 20 / 30 / 40 / 50%',dl:'average',r:'Important: guild capital pays for tides and war supplies.'}},
 {id:'arena',a:['st','ag'],d:4,g:'hi',ru:{n:'Арена',e:'Первые 1 / 2 / 3 / 4 / 5 смотрителей за день получают двойные награды за карты',v:'',dl:'очень легко',r:'Полезное: больше талантов или навыков с арены.'},en:{n:'Arena',e:'Your first 1 / 2 / 3 / 4 / 5 keepers each day get double card rewards',v:'',dl:'very easily',r:'Useful: more talents or skills from the arena.'}},

  `Одинаковые свойства эволюции не складываются: действует только самое сильное. ${OFF.ru}`,
  `Питомца, который сейчас эволюционирует, нельзя выбрать для обмена атрибутами. Если питомец предлагает помощь в скрещивании, сначала отмените запрос. ${OFF.ru}`],
 th:['Свойство','Свойство эволюции, ур. 1 → ур. 20','Для сравнения: базовое на ур. 6']},
en:{
 h:'Evolution', gives:'What evolution gives', limits:'Limits',
 lead:'Evolution is a separate way to strengthen a pet that has <b>already mutated</b>. It has nothing to do with breeding: none of it passes to offspring. In return it gives a second trait and a lot of bonus attributes.',
 steps:[
  `<b>Who can evolve.</b> Only a mutated pet with the required potential — it gets an "Evolution" button. ${OFF.en}`,
  `<b>Stage 1 — build progress.</b> Use essence or other mutated pets as material. Pets used this way are gone, but you get back part of what you spent on them. If you feed in a pet that was itself evolving, all its progress carries over. Different species need different amounts of progress; exclusive pets need more. ${OFF.en}`,
  `<b>Progress bonuses.</b> At certain progress thresholds the pet gets extra bonus attributes along the way. ${OFF.en}`,
  `<b>Stage 2 — fill the bar.</b> This needs species-specific materials. The stage is split into steps ("Deep Wisdom", "Pure Strength", "Steel Courage"), and each one adds to <b>all</b> attributes. ${OFF.en}`,
  `<b>Evolution complete.</b> The pet becomes the "young form" of a higher sub-species and can be levelled again. Every attribute bonus earned along the way stays, and you get one more boost on top. ${OFF.en}`],
 givesL:[
  `<b>A second trait — the evolved trait.</b> Same type as the base trait (a Lodge pet gets an evolved Lodge). It has <b>20 levels</b>. ${OFF.en} ${DAT.en}`,
  `<b>Effects add up.</b> Final effect = best base effect + best evolved effect, and they can come from different pets. E.g. Conclave can give up to 10% from the base trait plus up to 10% from evolution — up to 20% in total. ${OFF.en}`,
  `<b>Levelling the evolved trait.</b> With materials (different per species). Each attempt is randomly strong ("Excellent!"), average ("Not bad") or weak ("Meh") and gives different progress. A level takes 50,000 to 200,000 progress; all 20 levels take about 2.6 million (about 2.3 million for Alchemy and Fishing). ${OFF.en} ${DAT.en}`,
  `<b>The base trait grows too.</b> Evolution's attribute bonuses count towards total attributes, and that's what the base trait level uses. ${DAT.en}`,
  `<b>Attribute swap.</b> An evolved pet can swap <b>base</b> attributes with another pet of the same species. This lets you push the main attributes up to the next base trait threshold. ${OFF.en}`,
  `<b>Form editor.</b> Switch freely between unlocked looks. Cosmetic only. ${OFF.en}`],
 limitsL:[
  `An evolved pet <b>can't be released</b>. ${OFF.en}`,
  `The evolved trait is <b>not passed</b> to offspring. ${OFF.en}`,
  `Identical evolved traits don't stack: only the strongest works. ${OFF.en}`,
  `A pet that is evolving can't be picked for an attribute swap. If the pet is offered for breeding help, cancel that request first. ${OFF.en}`],
 th:['Trait','Evolved trait, lv 1 → lv 20','For comparison: base at lv 6']}};

// trait id, evolved lv1 → lv20, base lv6 (RU / EN where wording differs)
const EVOTBL = [
 ['conclave','+0.5 → +10%','+10%'],
 ['lodge','+5 → +100%','+100%'],
 ['dates','+5 → +100%','+100%'],
 ['barbell','+5 → +100%','+100%'],
 ['league','+15 → +300','+250'],
 ['wells','+2.5 → +50%','+50%'],
 ['crystals','+2.5 → +50%','+50%'],
 ['abyss','+2.5 → +50%','+50%'],
 ['mushrooms','+2.5 → +50%','+50%'],
 ['bottle','+2.5 → +50%','+50%'],
 ['portal',{ru:'+2,5 → +50%',en:'+2.5 → +50%'},'+50%'],
 ['arena',{ru:'шанс 11 → 30% получить Шкатулку господства при картах',en:'11 → 30% chance of a Dominance Casket from cards'},{ru:'5 смотрителей',en:'5 keepers'}],
 ['fishing',{ru:'шанс 40 → 78% доп. награды при вылове (с дневным лимитом)',en:'40 → 78% chance of an extra catch reward (daily cap)'},{ru:'5 смотрителей',en:'5 keepers'}],
 ['alchemy',{ru:'доп. шанс получить больше наград с реторт',en:'extra chance of more rewards from retorts'},{ru:'шанс 100%',en:'100% chance'}]];
const PORTAL = {ru:'Палата порталов', en:'Portal Chamber'}, ALCH = {ru:'Алхимия I и II', en:'Alchemy I & II'};

let lang = 'ru', filter = 'all';
try { const s = localStorage.getItem('pets-lang'); if (s === 'en' || s === 'ru') lang = s; } catch(e) {}

const $ = s => document.querySelector(s);
const dots = d => `<span class="dots">${[0,1,2,3].map(i => `<i style="${d !== null && i < d ? `background:var(--d${d})` : ''}"></i>`).join('')}</span>`;

function render(){
  const L = T[lang];
  document.documentElement.lang = lang;
  document.title = L.title;
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = L[el.dataset.t] ?? ''; });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  $('#thr').innerHTML = THR.map((v,i) => `<div><b>${v}</b><small>${L.lv[i]}</small></div>`).join('');
  $('#levelfacts').innerHTML = LEVELFACTS[lang].map(x => `<li>${x}</li>`).join('');
  $('#reach').innerHTML = `<thead><tr><th>${L.th_lv}</th><th>${L.th_need}</th><th>${L.th_who}</th><th>${L.th_when}</th></tr></thead><tbody>` +
    REACH[lang].map(([l,n,w,t]) => `<tr><td class="n">${l}</td><td class="num">${n}</td><td>${w}</td><td>${t}</td></tr>`).join('') + '</tbody>';
  $('#classes').innerHTML = `<thead><tr><th>${L.th_cls}</th><th>${L.th_sum}</th><th>${L.th_max}</th><th>${L.th_mut}</th><th>${L.th_main}</th><th>${L.th_mainm}</th><th>${L.th_trait}</th></tr></thead><tbody>` +
    CLASSES.map(([c,...r]) => `<tr><td class="n">${c}</td>${r.map(x => `<td class="num">${x}</td>`).join('')}</tr>`).join('') + '</tbody>';
  const E = EVO[lang];
  const loc = v => typeof v === 'object' ? v[lang] : (lang === 'ru' ? v.replace(/(\d)\.(\d)/g, '$1,$2') : v);
  const tname = id => id === 'portal' ? PORTAL[lang] : id === 'alchemy' ? ALCH[lang] : TRAITS.find(t => t.id === id)[lang].n;
  $('[data-t="h_evo"]').innerHTML = E.h;
  $('[data-t="evo_lead"]').innerHTML = E.lead;
  $('[data-t="h_evo_gives"]').innerHTML = E.gives;
  $('[data-t="h_evo_limits"]').innerHTML = E.limits;
  $('#evosteps').innerHTML = E.steps.map(x => `<li>${x}</li>`).join('');
  $('#evogives').innerHTML = E.givesL.map(x => `<li>${x}</li>`).join('');
  $('#evolimits').innerHTML = E.limitsL.map(x => `<li>${x}</li>`).join('');
  $('#evotbl').innerHTML = `<thead><tr>${E.th.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>` +
    EVOTBL.map(([id,a,b]) => `<tr><td>${tname(id)}</td><td>${loc(a)}</td><td>${loc(b)}</td></tr>`).join('') + '</tbody>';
  $('#terms').innerHTML = TERMS[lang].map(([t,d]) => `<div><dt>${t}</dt><dd>${d}</dd></div>`).join('');
  $('#basics').innerHTML = BASICS[lang].map(x => `<li>${x}</li>`).join('');
  $('#inherit').innerHTML = INHERIT[lang].map(x => `<li>${x}</li>`).join('');
  $('#steps').innerHTML = STEPS[lang].map(x => `<li>${x}</li>`).join('');
  $('#tips').innerHTML = TIPS[lang].map(([c,h,p]) => `<div class="box ${c}"><h3>${h}</h3><p>${p}</p></div>`).join('');
  $('#filters').innerHTML = [['all',L.all],['hi',L.dom_hi],['mid',L.dom_mid],['lo',L.dom_lo]]
    .map(([k,l]) => `<button type="button" data-f="${k}" aria-pressed="${k === filter}">${l}</button>`).join('');
  $('#grid').innerHTML = TRAITS.filter(t => filter === 'all' || t.g === filter).map(t => {
    const x = t[lang];
    return `<article class="trait">
      <button type="button" class="shot" data-img="img/pets/${t.id}.jpg" aria-label="${x.n}"><img src="img/pets/${t.id}.jpg" alt="${x.n}" loading="lazy"></button>
      <div class="body">
        <div class="name"><b>${x.n}</b></div>
        <div class="attrs" title="${L.main}">${t.a.map(k => `<span>${A[k][lang]}</span>`).join('')}</div>
        <div class="eff">${x.e}${x.v ? ` <b>${x.v}</b>` : ''}</div>
        <div class="dom">${dots(t.d)} ${L.dom}: ${x.dl}</div>
        <div class="note">${x.r}</div>
      </div></article>`;
  }).join('');
}

document.addEventListener('click', e => {
  const lb = e.target.closest('.lang button');
  if (lb) { lang = lb.dataset.lang; try { localStorage.setItem('pets-lang', lang); } catch(err) {} render(); return; }
  const fb = e.target.closest('#filters button');
  if (fb) { filter = fb.dataset.f; render(); return; }
  const sb = e.target.closest('.shot');
  if (sb) { const d = $('#zoom'); d.querySelector('img').src = sb.dataset.img; d.showModal(); return; }
});
$('#zoom').addEventListener('click', e => { if (e.target.tagName !== 'IMG') $('#zoom').close(); });

render();
</script>
</body>
</html>
