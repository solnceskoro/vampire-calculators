<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калькулятор талантов</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header with two totals (inventory / plan), step tabs; each section = inputs + result with "how it was computed" chains */
:root{
  --bg:#f5f2f4; --surface:#ffffff; --sunk:#ece6ea; --line:#ddd3d9;
  --ink:#24181e; --muted:#6f5f68; --accent:#8c1d3b; --accent-ink:#ffffff; --gold:#946c1e;
  --req:#fbefc9; --req-line:#d9b24c;
  --a0:#b8322f; --a1:#9b3f9e; --a2:#2d63b5; --a3:#2f8159;
  --good:#2f8159; --warn:#a8650c;
  --f-display:"Prata", "Cormorant Garamond", Georgia, serif;
  --f-body:"Golos Text", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16111a; --surface:#1f1824; --sunk:#130e16; --line:#352a3a;
  --ink:#efe6ec; --muted:#a998a4; --accent:#e0607e; --accent-ink:#1a0f14; --gold:#d6ad5a;
  --req:#3a2f17; --req-line:#a9862f;
  --a0:#ef6b67; --a1:#d07ad3; --a2:#6f9cf0; --a3:#5fc08f;
  --good:#5fc08f; --warn:#e3a54a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16111a; --surface:#1f1824; --sunk:#130e16; --line:#352a3a;
  --ink:#efe6ec; --muted:#a998a4; --accent:#e0607e; --accent-ink:#1a0f14; --gold:#d6ad5a;
  --req:#3a2f17; --req-line:#a9862f;
  --a0:#ef6b67; --a1:#d07ad3; --a2:#6f9cf0; --a3:#5fc08f;
  --good:#5fc08f; --warn:#e3a54a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h2{font-size:1.4rem} h3{font-size:1.08rem}
p{margin:0}
b{font-weight:600}
.muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 0}
.brand{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px}
.brand h1{font-size:1.55rem} .brand h1 span{color:var(--accent)}
.totals{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline}
.tot{display:flex;align-items:baseline;gap:8px}
.tot .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tot .val{font-family:var(--f-mono);font-size:1.3rem;font-weight:500;color:var(--accent)}
.unitsel{font:inherit;font-size:.8rem;padding:2px 4px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
nav.tabs{display:flex;flex-wrap:wrap;gap:0 2px;margin-top:8px}
nav.tabs button{font:inherit;font-size:.84rem;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:7px 7px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav.tabs .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
nav.tabs .dot.ok{background:var(--good)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.tab{padding-top:22px;display:grid;gap:20px}
.intro{max-width:72ch;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.panel.res{background:var(--sunk);border-color:transparent}
.panel-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
input[type=number],input[type=text],select{font:inherit;font-variant-numeric:tabular-nums;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 7px;min-width:0}
input[type=number]{width:5.6em}
input.w-l{width:8.5em}
.req input,.req select,input.req{background:var(--req);border-color:var(--req-line)}
label.f{display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end}
.btn{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:4px 8px}
.btn:hover{border-color:var(--accent)}
.pic{display:inline-block;vertical-align:middle;object-fit:contain;flex:none}
.pic.round{border-radius:50%;background:var(--sunk);object-fit:cover}
.chip .pic{margin:0 3px 0 -4px}
.who{display:inline-flex;align-items:center;gap:8px}
td.who{display:table-cell;vertical-align:middle}
td.who>.pic{margin-right:8px}
td.who>span{display:inline-block;vertical-align:middle}
.chip{display:inline-flex;align-items:center;font-size:.74rem;font-weight:600;padding:0 8px;border-radius:999px;white-space:nowrap;border:1px solid currentColor;line-height:1.6}
.c0{color:var(--a0)}.c1{color:var(--a1)}.c2{color:var(--a2)}.c3{color:var(--a3)}.cx{color:var(--muted)}
.stars{color:var(--gold);letter-spacing:-1px;white-space:nowrap;font-size:.85rem}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:baseline;margin:0}
.kv dt{color:var(--muted);font-size:.88rem}
.kv dd{margin:0;font-family:var(--f-mono);text-align:right}
.kv dd.big{font-size:1.15rem;color:var(--accent)}
.note{font-size:.82rem;color:var(--muted);max-width:78ch}
.warn{font-size:.84rem;color:var(--warn)}
.flag{font-size:.72rem;padding:1px 7px;border-radius:5px;background:var(--sunk);color:var(--warn);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:26px;height:14px;border-radius:4px;background:var(--req);border:1px solid var(--req-line);vertical-align:-2px;margin-right:6px}
/* шаги */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:700px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);display:grid;gap:4px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.step:hover{border-color:var(--accent)}
.step .sn{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.step .st{font-weight:600}
.step .ss{font-size:.82rem}
.step.ok .ss{color:var(--good)} .step.todo .ss{color:var(--warn)}
/* большой итог */
.hero{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero .card{background:var(--sunk);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.hero .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hero .big{font-family:var(--f-mono);font-size:1.9rem;color:var(--accent);line-height:1.2}
.hero .sub{font-size:.85rem;color:var(--muted)}
/* как посчитано */
details.how{margin-top:4px}
details.how>summary{cursor:pointer;font-size:.8rem;color:var(--accent);list-style:none;display:inline-flex;gap:4px;align-items:center}
details.how>summary::-webkit-details-marker{display:none}
details.how>summary::before{content:"▸";font-size:.7rem;transition:transform .15s}
details.how[open]>summary::before{transform:rotate(90deg)}
.chain{margin:6px 0 2px;padding:10px 12px;border-radius:8px;background:var(--sunk);display:grid;gap:3px;font-size:.84rem;max-width:62ch}
.panel.res .chain,.hero .chain{background:var(--surface)}
.chain .ln{display:grid;grid-template-columns:1.3em 1fr auto;gap:8px;align-items:baseline}
.chain .op{color:var(--muted);font-family:var(--f-mono);text-align:center}
.chain .v{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.chain .ln.tot{border-top:1px solid var(--line);padding-top:4px;margin-top:2px;font-weight:600}
.chain .ln.tot .v{color:var(--accent)}
.chain details{grid-column:2 / 4}
.chain details>summary{cursor:pointer;color:var(--muted);font-size:.78rem}
.chain .src{font-size:.78rem;color:var(--muted);padding:2px 0 2px 10px}
/* шпаргалка */
.scheme td,.scheme th{font-size:.84rem}
.scheme tr.hl td{background:var(--sunk);font-weight:600}
.yes{color:var(--good);font-weight:600} .no{color:var(--line)}
.formula-line{font-size:.85rem;padding:8px 12px;border-radius:8px;background:var(--sunk);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.formula-line .m{padding:1px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.formula-line .m.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.formula-line .m.off{opacity:.45;text-decoration:line-through}
/* смотрители */
.halo-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.halo{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:4px;background:var(--bg)}
.halo.on{border-color:var(--accent)}
.halo .hn{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.halo .hd{font-size:.78rem;color:var(--muted)}
.halo .hl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.8rem}
.search{width:min(320px,100%)}
.attr4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.attr4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.attr4 .cell{background:var(--sunk);border-radius:8px;padding:8px 10px;display:grid;gap:2px}
.attr4 .cell .v{font-family:var(--f-mono);font-size:1.05rem}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;min-width:0}
.kcard-h{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;padding:14px 16px;border-bottom:1px solid var(--line)}
.kcard-h h3{font-size:1.25rem;margin-right:auto}
.kcard-b{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
/* компактная таблица талантов: без горизонтальной прокрутки */
table.tt{table-layout:auto}
table.tt th{white-space:normal;font-size:.68rem;letter-spacing:.03em;padding:5px 4px;vertical-align:bottom}
table.tt td{padding:5px 4px;font-size:.84rem;vertical-align:middle}
table.tt td.r{white-space:nowrap}
table.tt input[type=number]{width:4.3em;padding:4px 5px}
table.tt input.w-l{width:6.4em}
table.tt .tn{line-height:1.25}
table.tt .tn .chip{font-size:.66rem;padding:0 6px;margin-top:2px}
table.tt .tn .stars{font-size:.72rem}
@media (max-width:860px){.kcard-b{grid-template-columns:minmax(0,1fr)}}
.kcard-b>div{padding:12px 16px;min-width:0}
.kcard-b>div+div{border-left:1px solid var(--line);background:var(--sunk)}
@media (max-width:860px){.kcard-b>div+div{border-left:0;border-top:1px solid var(--line)}}
.kcard-b td{vertical-align:middle}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.where{font-size:.82rem;background:var(--sunk);border-radius:8px;padding:10px 12px;display:grid;gap:4px}
.where ol{margin:0;padding-left:1.2em}
ol.fix{margin:0;padding-left:1.3em;display:grid;gap:6px;max-width:80ch}
.formula{font-family:var(--f-mono);font-size:.84rem;background:var(--sunk);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
@media (prefers-reduced-motion:reduce){details.how>summary::before{transition:none}}
</style>
<style>
.big-total{font-family:var(--f-mono);font-size:2.2rem;color:var(--accent);line-height:1.1}
.rule{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.rule>div{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:.86rem;display:flex;gap:10px;align-items:center}
.rule b{font-family:var(--f-mono);color:var(--accent)}
.pool{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end;margin-bottom:8px}
.pool .left{font-size:.82rem;padding-bottom:6px}
.kfoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;padding:12px 16px;border-top:1px solid var(--line);background:var(--sunk);border-radius:0 0 var(--r) var(--r)}
.kfoot .v{font-family:var(--f-mono);font-size:1.25rem;color:var(--accent)}
</style>

<noscript><div style="margin:16px;padding:16px;border:2px solid #e0607e;border-radius:10px;font:16px/1.5 sans-serif;color:#efe6ec;background:#1f1824">Калькулятору нужен JavaScript, а это приложение его не запускает. Откройте файл в браузере (Chrome, Яндекс Браузер, Safari): «Открыть с помощью» → браузер. Или откройте ссылку на калькулятор.</div></noscript>
<style>
/* телефон: ничего не шире экрана */
html,body{max-width:100%;overflow-x:hidden}
.brand,.totals,.tot{min-width:0;flex-wrap:wrap}
.wrap{max-width:min(1180px,100%)}
main,section.tab,.panel,.kcard,.grid2>*{min-width:0;max-width:100%}
.kcard-h>*{min-width:0}
.intro,.note,p{overflow-wrap:anywhere}
</style>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Калькулятор <span>талантов</span></h1>
      <div class="totals">
        <div class="tot"><span class="lbl">Рост таланта</span><span class="val num" id="tGain">0</span></div>
        <div class="tot" style="font-size:.8rem;color:var(--muted)">Общий талант&nbsp;<span class="num" id="tTot">0</span></div>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>

const full = v => (Math.round(v*10)/10).toLocaleString('ru-RU');
const pic = (k, s, cls='') => IMG[k] ? `<img class="pic ${cls}" src="${IMG[k]}" alt="" width="${s}" height="${s}" loading="lazy">` : '';
const chip = a => `<span class="chip c${a}">${pic('a'+AICON[a],14)}${AN[a]}</span>`;
const num = (id, v, attrs='') => `<input type="number" id="${id}" value="${esc(v)}" ${attrs}>`;

/* ---------- состояние ---------- */
const KEY = 'talent-calc-v1';
const EXAMPLE = {list:[
  {id:10540, lv:250, br:true, exp:15000, man:[0,0,60,0], t:[60,60,80,40,60], te:[12000,0,0,0,0], tm:[0,0,0,3,0]},
  {id:10280, lv:250, br:true, exp:8000, man:[30,0,0,20], t:[90,70,40,40,90,60], te:[4000,0,0,0,4000,0], tm:[30,0,0,0,20,0]}
]};
let S; try { S = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e) { S = null; }
if (!S) S = JSON.parse(JSON.stringify(EXAMPLE));
S.tab = S.tab || 'keep';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };

/* ---------- ранг и лимит ---------- */
function rankIdx(L){ let c = 0; for (const a of G.asc) if (a.min < L) c++; return Math.max(0, c-1); }
const isBoundary = L => G.asc.slice(0,7).some(a => a.max === L);
function rankOf(e){ const L = clamp(int(e.lv,1),1,450); let r = rankIdx(L); if (e.br && G.asc[r].max === L && r < 7) r++; return r; }

/* ---------- расчёт ---------- */
// рукопись: шанс 1/★ на +1 уровень (+★ очков) → в среднем 1 очко таланта; опыт: 200 × ★ за уровень → 200 опыта = 1 очко
function calc(e){
  const k = KBY[e.id]; if (!k) return null;
  const rank = rankOf(e), cap = G.asc[rank].tl;
  let usedExp = 0, usedMan = [0,0,0,0], P0 = 0, P1 = 0, gain = 0;
  const per = [0,0,0,0], tot0 = [0,0,0,0], tot1 = [0,0,0,0];
  const rows = k.t.map((t,ti) => {
    const cur = clamp(int(e.t[ti]),0,320), free = Math.max(0, cap - cur);
    const m = Math.max(0, int((e.tm||[])[ti])), x = Math.max(0, int((e.te||[])[ti]));
    usedMan[t.a] += m; usedExp += x;
    const mUse = Math.min(m, free * t.s);                 // рукописи сверх лимита пропадают
    const lvM = mUse / t.s;                               // в среднем уровней от рукописей
    const freeAfterM = free - lvM;
    const lvX = Math.min(Math.floor(freeAfterM), Math.floor(x / (200*t.s)));
    const xOver = Math.max(0, x - lvX*200*t.s);
    const nw = cur + lvM + lvX;
    const g = t.s * (lvM + lvX);
    P0 += t.s*cur; P1 += t.s*nw; gain += g; per[t.a] += g; tot0[t.a] += t.s*cur; tot1[t.a] += t.s*nw;
    return {t, ti, cur, free, m, x, mUse, mOver: m - mUse, lvM, lvX, xOver, nw, g};
  });
  return {k, rank, cap, rows, usedExp, usedMan, P0, P1, gain, per, tot0, tot1};
}

/* ---------- отрисовка ---------- */
function keeperOptions(){ return G.keepers.map(k=>`<option value="${k.id}">${esc(k.n)} ${stars(k.star)}</option>`).join(''); }
function card(e, i, r){
  const k = r.k, rk = G.asc[r.rank], L = clamp(int(e.lv,1),1,450);
  const attrs = [...new Set(k.t.map(t=>t.a))].sort();
  const pool = int(e.exp), manP = e.man || [0,0,0,0];
  const fmtLv = v => Number.isInteger(v) ? String(v) : '≈' + (Math.round(v*10)/10).toLocaleString('ru-RU');
  return `<article class="kcard">
    <div class="kcard-h">
      <h3 class="who">${pic('k'+k.id,52,'round')}<span>${esc(k.n)} <span class="stars">${stars(k.star)}</span></span></h3>
      <label class="f req" for="lv${i}">Уровень смотрителя ${num('lv'+i, e.lv, `min="1" max="450" data-k="${i}" data-f="lv"`)}</label>
      <span data-out="rk${i}" style="display:contents">${isBoundary(L) ? `<label class="f" for="br${i}" style="display:flex;gap:6px;align-items:center;padding-bottom:6px"><input type="checkbox" id="br${i}" data-k="${i}" data-f="br"${e.br?' checked':''}> прорыв на ${L} сделан</label>` : ''}
      <div class="f" style="font-size:.82rem;color:var(--muted)">Ранг: <b style="color:var(--ink)">${esc(rk.n)}</b><br>таланты до <b style="color:var(--ink)">${rk.tl}</b></div></span>
      <button class="btn ghost" data-act="del" data-i="${i}" aria-label="Удалить смотрителя">✕</button>
    </div>
    <div style="padding:12px 16px;display:grid;gap:8px">
      <div class="pool">
        <label class="f" for="ex${i}">${pic('i3030',22)} Опыт таланта у смотрителя (всего) ${num('ex'+i, e.exp||0, `min="0" class="w-l" data-k="${i}" data-f="exp"`)}</label>
        <div class="left" data-out="exl${i}">Вложено <b>${full(r.usedExp)}</b>, ${r.usedExp > pool ? `<span style="color:var(--warn)">больше запаса на ${full(r.usedExp - pool)}</span>` : `осталось <b>${full(pool - r.usedExp)}</b>`}</div>
      </div>
      <div class="pool">${attrs.map(a=>`<label class="f" for="mp${i}_${a}"><span class="who">${pic('i'+MANU_ID[a],22)}${chip(a)} рукописей есть</span>${num(`mp${i}_${a}`, manP[a]||0, `min="0" data-k="${i}" data-arr="man" data-j="${a}"`)}<span data-out="mpl${i}_${a}" style="font-size:.74rem">${r.usedMan[a] > int(manP[a]) ? `<span style="color:var(--warn)">вложено ${r.usedMan[a]}, больше запаса</span>` : `вложено ${r.usedMan[a]}, осталось ${int(manP[a]) - r.usedMan[a]}`}</span></label>`).join('')}</div>
      <p class="note">Уровни талантов вписывайте такими, какие они уже после использования свитков (каждый свиток ★N = +1 уровень = N очков). Дальше укажите, сколько рукописей и опыта таланта вложить в каждый талант.</p>
      <div class="scroll"><table class="tt">
        <thead><tr><th>Талант</th><th>Ур. сейчас</th><th>Рукописи в талант</th><th>Опыт таланта в талант</th><th class="r">Станет</th><th class="r">Очки таланта</th></tr></thead>
        <tbody>${r.rows.map(x=>`<tr>
          <td class="tn">${esc(x.t.n)}<br>${chip(x.t.a)} <span class="stars">${stars(x.t.s)}</span></td>
          <td class="req">${num(`t${i}_${x.ti}`, e.t[x.ti]??0, `min="0" max="320" data-k="${i}" data-arr="t" data-j="${x.ti}"`)}<div data-out="tf${i}_${x.ti}" style="font-size:.7rem;color:var(--muted)">до лимита ${x.free} ур.</div></td>
          <td>${num(`tm${i}_${x.ti}`, int((e.tm||[])[x.ti]) || '', `min="0" placeholder="0" data-k="${i}" data-arr="tm" data-j="${x.ti}"`)}<div data-out="tmo${i}_${x.ti}" style="font-size:.7rem;color:var(--muted)">${x.mOver ? `<span class="flag">лишние ${x.mOver}</span>` : `влезет ${x.free * x.t.s}`}</div></td>
          <td>${num(`te${i}_${x.ti}`, int((e.te||[])[x.ti]) || '', `min="0" step="${200*x.t.s}" class="w-l" placeholder="0" data-k="${i}" data-arr="te" data-j="${x.ti}"`)}<div data-out="teo${i}_${x.ti}" style="font-size:.7rem;color:var(--muted)">${x.xOver && x.x ? `не дадут уровня ${full(x.xOver)}` : `ур. = ${200*x.t.s} опыта`}</div></td>
          <td class="r num" data-out="tn${i}_${x.ti}"><b>${fmtLv(x.nw)}</b>${x.nw >= r.cap ? ' <span class="flag">лимит</span>' : ''}<div class="muted" style="font-size:.7rem">${x.lvM ? `рук. +${fmtLv(x.lvM)}` : ''}${x.lvM && x.lvX ? ', ' : ''}${x.lvX ? `опыт +${x.lvX}` : ''}</div></td>
          <td class="r num" data-out="tg${i}_${x.ti}"><b>${x.g ? '+' + full(x.g) : '0'}</b><div class="muted" style="font-size:.7rem">${full(x.t.s*x.cur)} → ${full(x.t.s*x.nw)}</div></td></tr>`).join('')}</tbody>
      </table></div>
    </div>
    <div class="kfoot" data-out="kf${i}">
      <span style="font-weight:600">Итого очков таланта: ${esc(k.n)}</span>
      <span class="v">+${full(r.gain)}</span>
      <span class="muted" style="font-size:.8rem;flex-basis:100%">Общий талант ${full(r.P0)} → <b style="color:var(--ink)">${full(r.P1)}</b> · ${r.per.map((g,a)=> g ? `${AN[a]} +${full(g)}` : '').filter(Boolean).join(' · ') || 'впишите рукописи или опыт'}</span>
    </div>
  </article>`;
}
function view(){
  const R = S.list.map(calc);
  const gain = R.reduce((s,r)=>s+(r?r.gain:0),0), P1 = R.reduce((s,r)=>s+(r?r.P1:0),0), P0 = R.reduce((s,r)=>s+(r?r.P0:0),0);
  if (S.tab === 'sum') return {R, gain, P0, P1, html: summary(R, gain, P0, P1)};
  return {R, gain, P0, P1, html: `
  <section class="tab" style="padding-top:22px;display:grid;gap:20px">
    <div class="panel">
      <h2>Как считаются очки таланта</h2>
      <p class="note">«Общий талант» смотрителя в игре — сумма ★ × уровень по всем его талантам. Рейтинг «Рост таланта» считает рост этой суммы. Калькулятор показывает, сколько очков таланта даст то, что вы вкладываете, с учётом лимита ранга. Данные взяты из файлов игры.</p>
      <div class="rule">
        <div>${pic('i4181',34)}<span>1 рукопись ≈ <b>1</b> очко<br><span class="muted" style="font-size:.78rem">шанс 1/★ на +1 ур. = +★ очков</span></span></div>
        <div>${pic('i3030',34)}<span>200 опыта таланта = <b>1</b> очко<br><span class="muted" style="font-size:.78rem">уровень стоит 200 × ★</span></span></div>
        <div>${pic('i4177',34)}<span>свиток ★N = <b>N</b> очков<br><span class="muted" style="font-size:.78rem">+1 уровень таланту ★N</span></span></div>
      </div>
      <p class="note">Пример: 3 рукописи в талант ★3 у Артемиды = в среднем 1 уровень = 3 очка таланта.</p>
    </div>
    <div class="row">
      <label class="f" for="addk">Смотритель (все ${G.keepers.length}) <select id="addk">${keeperOptions()}</select></label>
      <button class="btn pri" data-act="add">+ Добавить</button>
    </div>
    ${S.list.length ? '' : '<div class="empty">Добавьте смотрителя, чтобы посчитать очки таланта.</div>'}
    ${S.list.map((e,i)=> R[i] ? card(e,i,R[i]) : '').join('')}
    <div class="row"><button class="btn pri" data-tab="sum">Посмотреть итог →</button></div>
  </section>`};
}

function summary(R, gain, P0, P1){
  const rows = R.filter(Boolean);
  const byAttr = [0,0,0,0]; rows.forEach(r => r.per.forEach((g,a)=> byAttr[a] += g));
  const man = rows.reduce((s,r)=>s+r.usedMan.reduce((x,y)=>x+y,0),0), exp = rows.reduce((s,r)=>s+r.usedExp,0);
  return `<section class="tab" style="padding-top:22px;display:grid;gap:20px">
    <div class="panel" style="gap:6px">
      <span style="font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">Рост таланта (очки таланта)</span>
      <span class="big-total" data-out="sbig">+${full(gain)}</span>
      <span class="muted" data-out="ssub">Общий талант ${full(P0)} → <b style="color:var(--ink)">${full(P1)}</b> · рукописей ${full(man)} · опыта таланта ${full(exp)}</span>
      <div class="attr4" data-out="sattr" style="margin-top:8px">${byAttr.map((g,a)=>`<div class="cell"><span style="justify-self:start">${chip(a)}</span><span class="v" style="font-family:var(--f-mono)">+${full(g)}</span></div>`).join('')}</div>
    </div>
    <div class="panel">
      <h2>По смотрителям</h2>
      ${rows.length ? `<div class="scroll"><table class="tt"><thead><tr><th>Смотритель</th><th class="r">Ур.</th><th>Ранг</th><th class="r">Рукописи</th><th class="r">Опыт таланта</th><th class="r">Общий талант</th><th class="r">Очки таланта</th></tr></thead><tbody>${
        rows.map(r=>`<tr><td class="who">${pic('k'+r.k.id,30,'round')}${esc(r.k.n)}</td><td class="r num">${int(S.list[R.indexOf(r)].lv)}</td><td style="font-size:.78rem">${esc(G.asc[r.rank].n)}</td><td class="r num">${full(r.usedMan.reduce((s,v)=>s+v,0))}</td><td class="r num">${full(r.usedExp)}</td><td class="r num">${full(r.P0)} → ${full(r.P1)}</td><td class="r num"><b>+${full(r.gain)}</b></td></tr>`).join('')}
        <tr><td><b>Итого</b></td><td></td><td></td><td class="r num"><b>${full(man)}</b></td><td class="r num"><b>${full(exp)}</b></td><td class="r num"><b>${full(P0)} → ${full(P1)}</b></td><td class="r num"><b>+${full(gain)}</b></td></tr></tbody></table></div>` : '<div class="empty">Смотрители не добавлены. Добавьте их на вкладке «Смотрители».</div>'}
    </div>
    ${rows.map(r=>{ const used = r.rows.filter(x=>x.m||x.x); return used.length ? `<div class="panel">
      <div class="panel-h"><h3 class="who">${pic('k'+r.k.id,36,'round')}${esc(r.k.n)}</h3><b style="font-family:var(--f-mono);color:var(--accent)">+${full(r.gain)}</b></div>
      <div class="scroll"><table class="tt"><thead><tr><th>Талант</th><th class="r">Рукописи</th><th class="r">Опыт</th><th class="r">Уровень</th><th class="r">Очки таланта</th></tr></thead><tbody>${
        used.map(x=>`<tr><td>${esc(x.t.n)} ${chip(x.t.a)} <span class="stars">${stars(x.t.s)}</span></td><td class="r num">${x.m}${x.mOver?` <span class="flag">лишние ${x.mOver}</span>`:''}</td><td class="r num">${full(x.x)}</td><td class="r num">${x.cur} → ${Number.isInteger(x.nw)?x.nw:'≈'+(Math.round(x.nw*10)/10).toLocaleString('ru-RU')}</td><td class="r num"><b>+${full(x.g)}</b></td></tr>`).join('')}</tbody></table></div></div>` : ''; }).join('')}
    <p class="note">Рукописи считаются по среднему результату (шанс 1/★), поэтому фактический итог в игре может отличаться. 200 опыта таланта = 1 очко, свиток ★N = N очков.</p>
  </section>`;
}

function header(V){ document.getElementById('tGain').textContent = '+' + full(V.gain); document.getElementById('tTot').textContent = full(V.P0) + ' → ' + full(V.P1); }
function tabs(){ document.getElementById('tabs').innerHTML = [['keep','Смотрители'],['sum','Итог']].map(([id,n])=>`<button role="tab" aria-selected="${S.tab===id}" data-tab="${id}">${n}</button>`).join(''); }
function render(){ const V = view(); header(V); tabs(); document.getElementById('main').innerHTML = V.html; }
function refresh(){
  const V = view(); header(V);
  const tpl = document.createElement('template'); tpl.innerHTML = V.html;
  const fresh = {}; tpl.content.querySelectorAll('[data-out]').forEach(n => fresh[n.dataset.out] = n.innerHTML);
  document.getElementById('main').querySelectorAll('[data-out]').forEach(el => { const h = fresh[el.dataset.out]; if (h !== undefined && h !== el.innerHTML) el.innerHTML = h; });
}

/* ---------- события ---------- */
let timer;
function setFromInput(el){
  const v = el.value, k = el.dataset.k; if (k === undefined) return false;
  const e = S.list[+k];
  if (el.type === 'checkbox'){ e[el.dataset.f] = el.checked; return true; }
  const blankZero = el.dataset.arr === 'tm' || el.dataset.arr === 'te';
  if (String(v).trim() === '' && !blankZero) return false;
  const x = String(v).trim() === '' ? 0 : int(v);
  if (el.dataset.arr){ (e[el.dataset.arr] ||= [])[+el.dataset.j] = x; } else e[el.dataset.f] = x;
  return true;
}
document.addEventListener('input', ev => { const el = ev.target; if (el.type === 'checkbox' || el.tagName !== 'INPUT') return; if (setFromInput(el)){ save(); clearTimeout(timer); timer = setTimeout(refresh, 150); } });
document.addEventListener('change', ev => { const el = ev.target; if (el.type === 'checkbox'){ if (setFromInput(el)){ save(); render(); } } else if (el.tagName === 'INPUT'){ clearTimeout(timer); refresh(); } });
document.addEventListener('click', ev => {
  const tb = ev.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; save(); render(); window.scrollTo({top:0}); return; }
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const i = +t.dataset.i;
  if (t.dataset.act === 'add'){ const id = +document.getElementById('addk').value; const k = KBY[id];
    S.list.push({id, lv:1, br:false, exp:0, man:[0,0,0,0], t:k.t.map(()=>1), te:[], tm:[]}); }
  else if (t.dataset.act === 'del') S.list.splice(i,1);
  else return;
  save(); render();
});
render();
</script>

</body>
